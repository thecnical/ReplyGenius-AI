<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReplyGenius AI - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .section {
      background: #16161f;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border: 1px solid #2a2a3a;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #a0a0b0;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 15px;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .success { background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; }
  </style>
</head>
<body>
  <h1>⚡ ReplyGenius AI Settings</h1>
  
  <div class="section">
    <h2>API Configuration</h2>
    <label>Backend API URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
    
    <label>Default Tone</label>
    <select id="defaultTone">
      <option value="professional">Professional</option>
      <option value="casual">Casual</option>
      <option value="friendly">Friendly</option>
      <option value="funny">Funny</option>
      <option value="flirty">Flirty</option>
      <option value="formal">Formal</option>
    </select>
    
    <label>Default Priority</label>
    <select id="defaultPriority">
      <option value="fast">Fast</option>
      <option value="balanced" selected>Balanced</option>
      <option value="premium">Premium</option>
    </select>
    
    <button id="saveBtn">Save Settings</button>
    <div id="status" class="status hidden"></div>
  </div>
  
  <div class="section">
    <h2>Keyboard Shortcuts</h2>
    <p style="color: #a0a0b0;">
      <strong>Ctrl+Shift+G</strong> - Generate Reply<br>
      <strong>Ctrl+Enter</strong> - Submit in popup
    </p>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
